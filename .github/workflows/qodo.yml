name: Qodo custom rules check

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  custom-rules-check:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # pull_request_target grants secrets and a write-capable GITHUB_TOKEN even for
      # fork PRs, which is exactly why we must NEVER check out or execute the PR's own
      # head — that would let a PR rewrite this workflow/agent and run it against our
      # secrets. Checking out the default ref (no `ref:` override) gets the trusted
      # base-branch version of the agent config; the PR's actual diff is fetched
      # read-only via `gh pr diff`/`gh pr view` inside the agent, never checked out.
      - name: Checkout base branch (never the PR head — this job holds secrets)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Upgrade Copilot custom rules check
        uses: qodo-ai/command@v1
        env:
          QODO_API_KEY: ${{ secrets.QODO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prompt: pr-custom-rules-check
          agent-file: .github/qodo/agents/pr-custom-rules-check/agent.toml
          key-value-pairs: |
            pr_number=${{ github.event.pull_request.number }}
            repo_owner=${{ github.repository_owner }}
            repo_name=${{ github.event.repository.name }}
